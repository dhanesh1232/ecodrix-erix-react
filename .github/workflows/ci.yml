name: CI

# Manual only (14 Nov 2026): stopped running on every push/PR to save Actions minutes.
# Run it from the Actions tab before a risky release; tests also run locally before each commit.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Biome Check
        run: pnpm run check

      - name: Type Check
        run: pnpm run types

      - name: Build Library
        run: pnpm run build:lib
